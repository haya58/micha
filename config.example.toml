# ファイルパスは CONFIG_PATH 環境変数で指定する（既定: ./config.toml）

[bot]
id = "micha-bot"
display_name = "micha-bot"
respond_all = false

[discord]
token = ""
guild_id = ""
category_ids = ["catid1", "catid2"]
readonly_channel_ids = []
readonly_poll_sec = 300
login_notice_channel_id = ""

[database]
# BotごとにDB名を変える
url = "postgres://bot:botpass@localhost:5432/botdb?sslmode=disable"

[endpoints.openai]
base_url = "https://api.openai.com/v1"
api_key = ""
# extra_headers = { "x-opencode-session" = "ses_xxx" }

[models]
chat = "openai/gpt-4o-mini"
embedding = "openai/text-embedding-3-small"
embedding_dim = 1536

[brave]
api_key = ""

[persona]
path = ""

[random_talk]
probability = 0.02
cooldown_sec = 1800

[memory]
history_limit = 30
top_k = 8
readonly_per_channel = 10

[reaction]
probability = 0.15
cooldown_sec = 600

[shell]
enabled = true
image = "alpine:latest"
timeout_sec = 30

[server]
health_addr = ":8080"
