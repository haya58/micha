# dis-llm-bot 設定ファイル (TOML)
# 読み込み優先度: ビルトイン既定値 < 本ファイル。環境変数は CONFIG_PATH を除き参照しない。
# ファイルパスは CONFIG_PATH 環境変数で指定する（既定: ./config.toml）。

[bot]
id = "my-bot"
display_name = "my-bot"
respond_all = false

[discord]
token = ""
guild_id = ""
category_ids = ["catid1", "catid2"]
readonly_channel_ids = []
readonly_poll_sec = 300
login_notice_channel_id = ""

[database]
# ペルソナごとにDB名を変える（同一サーバ共用可）
url = "postgres://bot:botpass@localhost:5432/botdb?sslmode=disable"

[openai]
base_url = "https://api.openai.com/v1"
api_key = ""
model = "gpt-4o-mini"
embedding_model = "text-embedding-3-small"
embedding_dim = 1536
# extra_headers = { "x-opencode-session" = "ses_xxx" }

[brave]
api_key = ""

[persona]
path = ""

[random_talk]
probability = 0.02
cooldown_sec = 1800

[memory]
history_limit = 20
top_k = 5

[reaction]
probability = 0.15
cooldown_sec = 600

[shell]
enabled = true
image = "alpine:latest"
timeout_sec = 30

[server]
health_addr = ":8080"
