apiVersion: v1
kind: Secret
metadata:
  name: bot-config-toml
type: Opaque
# App settings live only in this TOML file (environment variables are not
# read). For multi-bot setups, duplicate this Secret per persona and change
# the dbname in database_url.
stringData:
  config.toml: |
    bot_id = "my-bot"
    display_name = "my-bot"
    discord_bot_token = "replace-me"
    discord_guild_id = "replace-me"
    discord_category_ids = ["catid1", "catid2"]
    database_url = "postgres://bot:botpass@postgres:5432/botdb?sslmode=disable"
    openai_base_url = "https://api.openai.com/v1"
    openai_api_key = "replace-me"
    openai_model = "gpt-4o-mini"
    openai_embedding_model = "text-embedding-3-small"
    embedding_dim = 1536
    brave_api_key = ""
    persona_path = "/persona/persona.md"
    respond_all = false
    readonly_channel_ids = []
    shell_enabled = true
    shell_image = "alpine:latest"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bot-persona
data:
  persona.md: |
    # Managed persona
    # Mounted at /persona/persona.md. Set PERSONA_PATH to this file.
    You are a friendly shared chat bot. Keep replies short and helpful.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dis-llm-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dis-llm-bot
  template:
    metadata:
      labels:
        app: dis-llm-bot
    spec:
      containers:
        - name: bot
          image: dis-llm-bot:latest
          ports:
            - containerPort: 8080
          env:
            - name: CONFIG_PATH
              value: /config/config.toml
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: persona
              mountPath: /persona
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
        # DinD sidecar for disposable `docker run --network none` exec.
        # Bot container talks to it via DOCKER_HOST. Privileged only here.
        - name: dind
          image: docker:dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
      volumes:
        - name: config
          secret:
            secretName: bot-config-toml
            items:
              - key: config.toml
                path: config.toml
        - name: persona
          configMap:
            name: bot-persona
