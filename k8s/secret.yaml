apiVersion: v1
kind: Secret
metadata:
  name: bot-config-toml
type: Opaque
# App settings live only in this TOML file (environment variables are not
# read). For multi-bot setups, duplicate this Secret per persona and change
# the dbname in database_url.
stringData:
  config.toml: |
    [bot]
    id = "my-bot"
    display_name = "my-bot"
    respond_all = false

    [discord]
    token = "replace-me"
    guild_id = "replace-me"
    category_ids = ["catid1", "catid2"]
    readonly_channel_ids = []
    readonly_poll_sec = 300
    login_notice_channel_id = ""

    [database]
    url = "postgres://bot:botpass@postgres:5432/botdb?sslmode=disable"

    [openai]
    base_url = "https://api.openai.com/v1"
    api_key = "replace-me"
    model = "gpt-4o-mini"
    embedding_model = "text-embedding-3-small"
    embedding_dim = 1536

    [brave]
    api_key = ""

    [persona]
    path = "/persona/persona.md"

    [random_talk]
    probability = 0.02
    cooldown_sec = 1800

    [memory]
    history_limit = 20
    top_k = 5

    [shell]
    enabled = true
    image = "alpine:latest"
    timeout_sec = 30

    [server]
    health_addr = ":8080"
