apiVersion: v1
kind: Secret
metadata:
  name: bot-config-toml
type: Opaque
# App settings live only in this TOML file (environment variables are not
# read). For multi-bot setups, duplicate this Secret per persona and change
# the dbname in database_url.
stringData:
  config.toml: |
    [bot]
    id = "my-bot"
    display_name = "my-bot"
    respond_all = false

    [discord]
    token = "replace-me"
    guild_id = "replace-me"
    category_ids = ["catid1", "catid2"]
    readonly_channel_ids = []
    readonly_poll_sec = 300
    login_notice_channel_id = ""

    [database]
    url = "postgres://bot:botpass@postgres:5432/botdb?sslmode=disable"

    [openai]
    base_url = "https://api.openai.com/v1"
    api_key = "replace-me"
    model = "gpt-4o-mini"
    embedding_model = "text-embedding-3-small"
    embedding_dim = 1536

    [brave]
    api_key = ""

    [persona]
    path = "/persona/persona.md"

    [random_talk]
    probability = 0.02
    cooldown_sec = 1800

    [memory]
    history_limit = 20
    top_k = 5

    [shell]
    enabled = true
    image = "alpine:latest"
    timeout_sec = 30

    [server]
    health_addr = ":8080"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bot-persona
data:
  persona.md: |
    # Managed persona
    # Mounted at /persona/persona.md. Set PERSONA_PATH to this file.
    You are a friendly shared chat bot. Keep replies short and helpful.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dis-llm-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dis-llm-bot
  template:
    metadata:
      labels:
        app: dis-llm-bot
    spec:
      containers:
        - name: bot
          image: dis-llm-bot:latest
          ports:
            - containerPort: 8080
          env:
            - name: CONFIG_PATH
              value: /config/config.toml
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: persona
              mountPath: /persona
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
        # DinD sidecar for disposable `docker run --network none` exec.
        # Bot container talks to it via DOCKER_HOST. Privileged only here.
        - name: dind
          image: docker:dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
      volumes:
        - name: config
          secret:
            secretName: bot-config-toml
            items:
              - key: config.toml
                path: config.toml
        - name: persona
          configMap:
            name: bot-persona
