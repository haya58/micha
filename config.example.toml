# dis-llm-bot 設定ファイル (TOML)
# 読み込み優先度: ビルトイン既定値 < 本ファイル < 環境変数
# ファイルパスは CONFIG_PATH 環境変数で指定する（既定: ./config.toml）。
# ファイルが存在しない場合は環境変数のみで動作する。

bot_id = "my-bot"
display_name = "my-bot"

# 必須項目（環境変数 DISCORD_BOT_TOKEN 等でも可）
discord_bot_token = ""
discord_guild_id = ""
discord_category_ids = ["catid1", "catid2"]
database_url = "postgres://bot:botpass@localhost:5432/botdb?sslmode=disable"
openai_api_key = ""

# 任意項目（以下は既定値）
openai_base_url = "https://api.openai.com/v1"
openai_model = "gpt-4o-mini"
openai_embedding_model = "text-embedding-3-small"
embedding_dim = 1536
# openai_extra_headers = { "x-opencode-session" = "ses_xxx" }

brave_api_key = ""
persona_path = ""
random_talk_probability = 0.02
random_talk_cooldown = 1800
respond_all = false
login_notice_channel_id = ""
readonly_channel_ids = []
readonly_poll_sec = 300
history_limit = 20
memory_top_k = 5
shell_enabled = true
shell_image = "alpine:latest"
shell_timeout = 30
health_addr = ":8080"
