apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - k8s/secret.yaml
  - k8s/deployment.yaml

# Persona lives in its own file so it can be edited without touching
# manifests. Switch persona/shion.md to the persona of the bot being
# deployed. `kubectl apply -k .` from the repo root picks this up.
configMapGenerator:
  - name: bot-persona
    files:
      - persona.md=persona/shion.md

generatorOptions:
  # Keep the ConfigMap name stable so k8s/deployment.yaml can reference it.
  disableNameSuffixHash: true
