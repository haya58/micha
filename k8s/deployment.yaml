apiVersion: apps/v1
kind: Deployment
metadata:
  name: dis-llm-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dis-llm-bot
  template:
    metadata:
      labels:
        app: dis-llm-bot
    spec:
      containers:
        - name: bot
          # Build from the repo root: docker build -f docker/Dockerfile .
          image: dis-llm-bot:latest
          ports:
            - containerPort: 8080
          env:
            - name: CONFIG_PATH
              value: /config/config.toml
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: persona
              mountPath: /persona
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
        # DinD sidecar for disposable `docker run --network none` exec.
        # Bot container talks to it via DOCKER_HOST. Privileged only here.
        - name: dind
          image: docker:dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
      volumes:
        - name: config
          secret:
            secretName: bot-config-toml
            items:
              - key: config.toml
                path: config.toml
        - name: persona
          configMap:
            name: bot-persona
