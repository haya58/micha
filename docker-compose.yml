services:
  # One postgres SERVER shared by all bots; each bot/persona uses its own
  # DATABASE (same server, different dbname). Extra DBs are created at init
  # from EXTRA_DBS. Each bot gets its own bot service (or its own compose
  # file / k8s Deployment) pointing DATABASE_URL at its own dbname.
  bot:
    build: .
    environment:
      BOT_ID: ${BOT_ID:-my-bot}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?set me}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?set me}
      DISCORD_CATEGORY_IDS: ${DISCORD_CATEGORY_IDS:?set me}
      DATABASE_URL: postgres://bot:botpass@db:5432/${BOT_DB:-botdb}?sslmode=disable
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set me}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EXTRA_HEADERS: ${OPENAI_EXTRA_HEADERS:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      PERSONA_PATH: ${PERSONA_PATH:-}
      RESPOND_ALL: ${RESPOND_ALL:-false}
      STATUS_DELAY_SEC: ${STATUS_DELAY_SEC:-4}
      SHELL_ENABLED: "true"
      SHELL_IMAGE: ${SHELL_IMAGE:-alpine:latest}
    ports:
      - "8085:8080"
    depends_on:
      - db
      - dind
    volumes:
      - ./persona:/persona:ro

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: botpass
      POSTGRES_DB: botdb
      EXTRA_DBS: ${EXTRA_DBS:-}
    volumes:
      - botdb:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  # Second bot example (same postgres server, different database):
  #   bot-kuro:
  #     extends: bot
  #     environment:
  #       BOT_ID: kuro
  #       DATABASE_URL: postgres://bot:botpass@db:5432/botdb_kuro?sslmode=disable
  # ...plus EXTRA_DBS=botdb_kuro on the db service (or CREATE DATABASE manually).

  # Disposable shell executor sidecar (network isolated per exec via --network none)
  dind:
    image: docker:dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - dind-certs:/certs/client

volumes:
  botdb:
  dind-certs:
